[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short traceback, print captured stdout on failure
addopts = -v --tb=short -s

# Treat warnings as errors to catch deprecations early
filterwarnings =
    error
    ignore::DeprecationWarning:pyspark.*
    ignore::DeprecationWarning:delta.*
